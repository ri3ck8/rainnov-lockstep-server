syntax = "proto3";

package lockstep.v1;

option java_package = "com.rainnov.lockstep.protocol";
option java_multiple_files = true;
option java_outer_classname = "LockstepV1Proto";

// Envelope 是 WebSocket 二进制帧承载的唯一顶层载荷。
// protocol_version 当前为 1。
message Envelope {
  uint32 protocol_version = 1;
  // 可选的应用层关联 ID。服务端主动发送的消息可以将其留空。
  string request_id = 2;

  oneof payload {
    ClientHello client_hello = 10;
    ServerHello server_hello = 11;
    ClientInput client_input = 12;
    ServerFrame server_frame = 13;
    MatchEvent match_event = 14;
    ProtocolError protocol_error = 15;
    ClientPing client_ping = 16;
    ServerPong server_pong = 17;
  }
}

// 每个新建或重连会话发送的第一条应用层消息。
message ClientHello {
  string room_id = 1;
  string match_id = 2;
  string player_id = 3;
  string ticket = 4;
  // 首次连接时为零；重连时为客户端已完整应用的最后一个 ServerFrame。
  uint32 last_applied_frame = 5;
}

message ServerHello {
  string node_id = 1;
  string room_id = 2;
  string match_id = 3;
  string player_id = 4;
  MatchPhase match_phase = 5;
  uint32 current_frame = 6;
  uint32 tick_rate = 7;
  uint32 input_delay_frames = 8;
  uint32 max_lead_frames = 9;
  // 此消息之后的闭区间回放范围；无需回放时两个值均为零。
  uint32 replay_from_frame = 10;
  uint32 replay_to_frame = 11;
  // 心跳和重连参数以本次分配返回的值为准。
  uint32 client_ping_interval_ms = 12;
  uint32 connection_idle_timeout_ms = 13;
  uint32 reconnect_grace_ms = 14;
}

message ClientInput {
  uint32 target_frame = 1;
  // 每位玩家单调递增的序列号。序列号零保留给服务端生成的空操作。
  uint32 sequence = 2;
  // 与引擎无关的不透明游戏指令字节。
  bytes payload = 3;
}

message PlayerFrameInput {
  string player_id = 1;
  bool no_op = 2;
  // no_op 为 true 时取零。
  uint32 sequence = 3;
  // no_op 为 true 时为空。
  bytes payload = 4;
}

message ServerFrame {
  uint32 frame_id = 1;
  // 条目始终按照房间分配时确定的玩家顺序排列。
  repeated PlayerFrameInput inputs = 2;
}

message MatchEvent {
  EventType type = 1;
  // 事件不针对特定玩家时为空。
  string player_id = 2;
  // 由服务端或控制面提供的稳定、机器可读原因。
  string reason = 3;
  uint32 frame_id = 4;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  // 为 true 时，服务端发送此消息后关闭连接。
  bool fatal = 3;
}

// 客户端在认证后按固定周期发送此消息，不会因其他出站流量而停止发送。
message ClientPing {
  uint32 sequence = 1;
}

message ServerPong {
  // 原样返回 ClientPing 中的 sequence。
  uint32 sequence = 1;
}

enum MatchPhase {
  MATCH_PHASE_UNSPECIFIED = 0;
  MATCH_PHASE_WAITING_FOR_PLAYERS = 1;
  MATCH_PHASE_RUNNING = 2;
  MATCH_PHASE_FINISHED = 3;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_MATCH_STARTED = 1;
  EVENT_TYPE_PLAYER_DISCONNECTED = 2;
  EVENT_TYPE_PLAYER_RECONNECTED = 3;
  EVENT_TYPE_CATCH_UP_COMPLETED = 4;
  EVENT_TYPE_MATCH_TERMINATING = 5;
  EVENT_TYPE_MATCH_ENDED = 6;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_MALFORMED_MESSAGE = 1;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_PROTOCOL = 2;
  PROTOCOL_ERROR_CODE_HELLO_TIMEOUT = 3;
  PROTOCOL_ERROR_CODE_AUTHENTICATION_FAILED = 4;
  PROTOCOL_ERROR_CODE_ALREADY_AUTHENTICATED = 5;
  PROTOCOL_ERROR_CODE_ROOM_NOT_ACTIVE = 6;
  PROTOCOL_ERROR_CODE_MATCH_MISMATCH = 7;
  PROTOCOL_ERROR_CODE_PLAYER_NOT_RESERVED = 8;
  PROTOCOL_ERROR_CODE_INVALID_TARGET_FRAME = 9;
  PROTOCOL_ERROR_CODE_DUPLICATE_INPUT = 10;
  PROTOCOL_ERROR_CODE_INPUT_TOO_LARGE = 11;
  PROTOCOL_ERROR_CODE_REPLAY_HISTORY_EXPIRED = 12;
}
