plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.5'
}

group = 'com.rainnov'
version = '0.0.1-SNAPSHOT'
description = 'rainnov-lockstep-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec) {
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    ]
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.31.1'
    }
}

sourceSets {
    testClient {
        java.srcDir 'src/testClient/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    testClientImplementation.extendsFrom implementation
    testClientRuntimeOnly.extendsFrom runtimeOnly
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runFrameSyncClient', JavaExec) {
    group = 'verification'
    description = '运行独立的多玩家帧同步测试客户端'
    classpath = sourceSets.testClient.runtimeClasspath
    mainClass = 'com.rainnov.lockstep.testclient.LockstepTestClient'
    standardInput = System.in

    if (project.hasProperty('testClientArgs')) {
        args project.property('testClientArgs').toString().split(/\s+/)
    }
}

tasks.named('check') {
    dependsOn tasks.named('testClientClasses')
}
